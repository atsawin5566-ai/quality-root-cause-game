<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quality Root Cause Challenge</title><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;margin:0;padding:20px} .wrap{max-width:900px;margin:auto}.card{background:#1e293b;padding:20px;border-radius:16px;margin-top:15px}.btn{display:block;width:100%;padding:12px;margin:8px 0;border:none;border-radius:10px;background:#334155;color:#fff;cursor:pointer}.btn:hover{background:#475569}#next{display:none;background:#16a34a}.correct{color:#4ade80}.wrong{color:#f87171}</style></head><body><div class="wrap"><h1>🎯 Quality Root Cause Challenge</h1><div class="card">คะแนน: <span id="score">0</span></div><div id="game"></div></div><script>const qs=[{t:'ขนาดชิ้นงานเกินสเปค',q:'เครื่องจักรปกติ วัตถุดิบปกติ เครื่องมือวัดเกินกำหนด Calibration 30 วัน',o:['วัตถุดิบ','พนักงานวัดงาน','เครื่องมือวัด','สภาพอากาศ'],a:3,e:'เครื่องมือวัดเกินกำหนด Calibration มีความเป็นไปได้สูงสุด'},{t:'ลูกค้าได้รับสินค้าติด Label ผิดรุ่น',q:'ผลิต 2 รุ่นพร้อมกัน, Label ถูกวางรวมกัน และ WI ไม่ระบุการแยกพื้นที่',o:['Supplier ส่งผิด','ไม่มีการควบคุมการแยก Label','Printer เสีย','ลูกค้าตรวจผิด'],a:2,e:'ไม่มีการควบคุมการแยก Label'},{t:'พบรอยขีดข่วนบนผลิตภัณฑ์',q:'เครื่องจักรปกติ, เปลี่ยนใช้ Tray ของ Supplier ใหม่',o:['พนักงานทำงานผิด','Tray ใหม่มีผิวหยาบ','AOI ตรวจผิด','เครื่องจักรเสีย'],a:1,e:'Tray ใหม่มีผิวหยาบ มีความเป็นไปได้สูงสุด'},{t:'ทองแดงเป็นสนิม',q:'พบสนิมก่อนเข้าเครื่อง Stamping, พาเลทงานปกติ ไม่เสียหาย, พบว่าทองแดงเก็บไว้นานเกิน2ปี และหมดอายุเกิน 300วัน',o:['ความชื้นในพื้นที่จัดเก็บสูง','ทองแดงหมดอายุการจัดเก็บ','Operator ตรวจสอบไม่ละเอียด','Supplier ขนส่งผิดวิธี'],a:2,e:'ทองแดงหมดอายุการจัดเก็บ'},{t:'Dimension OOS',q:'Vernier เลย Calibration 45 วัน',o:['Material','Measurement System','Operator','Environment'],a:1,e:'Measurement ไม่น่าเชื่อถือ'}];let c=0,s=0;function show(){if(c>=qs.length){document.getElementById('game').innerHTML=`<div class=card><h2>จบเกม</h2><h3>คะแนน ${s}/50</h3><button class=btn onclick='location.reload()'>เล่นใหม่</button></div>`;return;}let q=qs[c];let h=`<div class=card><h2>${q.t}</h2><p>${q.q}</p>`;q.o.forEach((x,i)=>h+=`<button class='btn' onclick='ans(${i})'>${x}</button>`);h+=`<div id=r></div><button id=next class=btn onclick='c++;show()'>ข้อถัดไป</button></div>`;document.getElementById('game').innerHTML=h;}function ans(i){let q=qs[c];let r=document.getElementById('r');if(i===q.a){s+=10;r.innerHTML=`<p class=correct>✅ ถูกต้อง - ${q.e}</p>`;}else{r.innerHTML=`<p class=wrong>❌ ไม่ถูก - ${q.e}</p>`;}document.getElementById('score').textContent=s;document.querySelectorAll('.btn').forEach(b=>{if(b.id!=='next')b.disabled=true});document.getElementById('next').style.display='block';}show();</script></body></html>
