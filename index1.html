<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5 Why Root Cause Challenge</title>

<style>
body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
margin:0;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
margin-top:15px;
}

h1{
text-align:center;
color:#facc15;
}

.slot{
min-height:60px;
background:#334155;
border:2px dashed #64748b;
border-radius:10px;
padding:10px;
margin:8px 0;
}

.item{
background:#2563eb;
padding:12px;
margin:8px 0;
border-radius:10px;
cursor:pointer;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#16a34a;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#15803d;
}

.correct{
color:#4ade80;
font-weight:bold;
}

.wrong{
color:#f87171;
font-weight:bold;
}

.score{
font-size:20px;
color:#facc15;
font-weight:bold;
}

.selected{
outline:3px solid yellow;
}
</style>
</head>

<body>

<div class="container">

<h1>🎯 5 Why Root Cause Challenge</h1>

<div class="card">

<div class="score">
คะแนนรวม : <span id="score">0</span>
</div>

<hr>

<h2 id="caseTitle"></h2>

<div id="slots"></div>

<h3>ลาก/เลือก Why ด้านล่าง</h3>

<div id="pool"></div>

<button onclick="checkAnswer()">
✅ ตรวจคำตอบ
</button>

<button onclick="newCase()">
🔄 สุ่มโจทย์ใหม่
</button>

<div id="result"></div>

</div>

</div>

<script>

const cases = [

{
title:"Peeling Defect",
rootCause:"ไม่มีการ Verify อุณหภูมิหลังเปลี่ยน Heater",
whys:[
"เกิด Peeling บนชิ้นงาน",
"Adhesive ยึดเกาะไม่สมบูรณ์",
"ความร้อนไม่เพียงพอในการ Cure",
"อุณหภูมิ Oven จริงต่ำกว่าสเปค",
"ไม่มีการ Verify อุณหภูมิหลังเปลี่ยน Heater"
]
},

{
title:"Copper Rust",
rootCause:"ทองแดงหมดอายุการจัดเก็บ",
whys:[
"ทองแดงเป็นสนิม",
"เกิด Oxidation บนผิวทองแดง",
"เก็บเกิน Shelf Life",
"ไม่มีการควบคุม FIFO",
"ไม่มีระบบแจ้งเตือนวัตถุดิบหมดอายุ"
]
},

{
title:"Wrong Label",
rootCause:"ไม่มีการควบคุมการแยก Label",
whys:[
"ลูกค้าได้รับสินค้าติด Label ผิดรุ่น",
"หยิบ Label ผิด",
"Label สองรุ่นถูกวางรวมกัน",
"ไม่มีการแยกพื้นที่จัดเก็บ",
"WI ไม่กำหนดวิธีควบคุม Label"
]
},

{
title:"Dent on Surface",
rootCause:"วาง Tray ซ้อนเกินมาตรฐาน",
whys:[
"เกิด Dent บนผิวชิ้นงาน",
"ชิ้นงานถูกกดทับ",
"ซ้อน WIP Tray สูงเกินกำหนด",
"Operator ไม่ปฏิบัติตาม WI",
"ไม่มีการ Audit การจัดเก็บ WIP"
]
},

{
title:"Dimension OOS",
rootCause:"เครื่องมือวัดไม่ได้ Calibration",
whys:[
"ขนาดชิ้นงานเกินสเปค",
"ผลการวัดไม่ถูกต้อง",
"Vernier คลาดเคลื่อน",
"เลยกำหนด Calibration",
"ไม่มีระบบติดตาม Calibration"
]
}

];

function shuffle(array){
for(let i=array.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[array[i],array[j]]=[array[j],array[i]];
}
}

let score=0;
let selectedItem=null;
let currentCase=null;

function newCase(){

document.getElementById("result").innerHTML="";

currentCase =
cases[Math.floor(Math.random()*cases.length)];

document.getElementById("caseTitle").innerHTML =
"🏭 Case : " + currentCase.title;

const slots=document.getElementById("slots");
const pool=document.getElementById("pool");

slots.innerHTML="";
pool.innerHTML="";

for(let i=0;i<5;i++){

slots.innerHTML +=
`
<div>
<b>Why ${i+1}</b>
<div class="slot"></div>
</div>
`;

}

let shuffled=[...currentCase.whys];

shuffle(shuffled);

shuffled.forEach(text=>{

let div=document.createElement("div");

div.className="item";

div.innerText=text;

div.onclick=function(){

document
.querySelectorAll(".item")
.forEach(x=>x.classList.remove("selected"));

selectedItem=div;

div.classList.add("selected");
};

pool.appendChild(div);

});

document
.querySelectorAll(".slot")
.forEach(slot=>{

slot.onclick=function(){

if(selectedItem){

slot.innerHTML="";

slot.appendChild(selectedItem);

selectedItem.classList.remove("selected");

selectedItem=null;

}

};

});

}

function checkAnswer(){

let correct=0;

let detail="";

document
.querySelectorAll(".slot")
.forEach((slot,index)=>{

let item=slot.querySelector(".item");

if(item &&
item.innerText===currentCase.whys[index]){

correct++;

detail +=
`✅ Why ${index+1}: ${currentCase.whys[index]}<br><br>`;

}else{

detail +=
`❌ Why ${index+1}: ${currentCase.whys[index]}<br><br>`;
}

});

if(correct===5){

score+=10;

document.getElementById("score").innerText=score;

document.getElementById("result").innerHTML=
`
<p class="correct">
🏆 ถูกต้องทั้งหมด (+10 คะแนน)
</p>

<hr>

${detail}

<hr>

<b>Root Cause:</b><br>
${currentCase.rootCause}
`;

}else{

document.getElementById("result").innerHTML=
`
<p class="wrong">
✅ ถูก ${correct}/5
</p>

<hr>

${detail}

<hr>

<b>Root Cause:</b><br>
${currentCase.rootCause}
`;
}

}

newCase();

</script>

</body>
</html>
