<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quality Root Cause Challenge</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    margin-top:15px;
}

h1{
    text-align:center;
    color:#facc15;
}

.btn{
    width:100%;
    margin:8px 0;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#334155;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.btn:hover{
    background:#475569;
}

.correct{
    color:#4ade80;
    font-weight:bold;
}

.wrong{
    color:#f87171;
    font-weight:bold;
}

#nextBtn{
    display:none;
    background:#16a34a;
}

.score{
    color:#facc15;
    font-size:20px;
    font-weight:bold;
}

.result{
    margin-top:10px;
}

.final{
    text-align:center;
}
</style>

</head>
<body>

<div class="container">

<h1>🎯 Quality Root Cause Challenge</h1>

<div class="card">
<div class="score">
คะแนน : <span id="score">0</span>
</div>
</div>

<div id="game"></div>

</div>

<script>

const questions = [

{
title:"ทองแดงเป็นสนิม",
question:"ข้อมูล  พบสนิมก่อนเข้าเครื่อง Stamping พาเลทงานปกติ ไม่เสียหาย และพบว่าทองแดงหมดอายุเกิน 300 วัน",
choices:[
"ความชื้นในพื้นที่จัดเก็บสูง",
"ทองแดงหมดอายุการจัดเก็บ",
"Operator ตรวจสอบไม่ละเอียด",
"Supplier ขนส่งผิดวิธี"
],
answer:1,
explain:"Root Cause : ทองแดงหมดอายุการจัดเก็บ"
},

{
title:"รอยขีดข่วนบนผลิตภัณฑ์",
question:"ข้อมูล  เครื่องจักรปกติ และเปลี่ยนใช้ Tray ของ Supplier ใหม่",
choices:[
"พนักงานทำงานผิด",
"Tray ใหม่มีผิวหยาบ",
"AOI ตรวจผิด",
"เครื่องจักรเสีย"
],
answer:1,
explain:"Root Cause : Tray ใหม่มีผิวหยาบ"
},

{
title:"ลูกค้าได้รับสินค้าติด Label ผิดรุ่น",
question:"ข้อมูล  ผลิต 2 รุ่นพร้อมกัน Label ถูกวางรวมกัน และ WI ไม่ระบุการแยกพื้นที่",
choices:[
"Supplier ส่งผิด",
"ไม่มีการควบคุมการแยก Label",
"Printer เสีย",
"ลูกค้าตรวจผิด"
],
answer:1,
explain:"Root Cause : ไม่มีการควบคุมการแยก Label"
},

{
title:"ขนาดชิ้นงานเกินสเปค",
question:"ข้อมูล เครื่องจักรปกติ วัตถุดิบปกติ เครื่องมือวัดเกินกำหนด Calibration 30 วัน",
choices:[
"วัตถุดิบ",
"เครื่องมือวัด",
"พนักงานวัดงาน",
"สภาพแวดล้อม"
],
answer:1,
explain:"Root Cause : เครื่องมือวัดเกินกำหนด Calibration"
},

{
title:"Dent on Surface",
question:"ข้อมูล  พบ Dent และพบว่ามีการซ้อน Tray สูงเกิน WI",
choices:[
"วัตถุดิบ คุณภาพต่ำ",
"วาง Tray ซ้อนเกินมาตรฐาน",
"เครื่องจักรผิดปกติ",
"ลูกค้าขนส่งผิด"
],
answer:1,
explain:"Root Cause : วาง Tray ซ้อนเกินมาตรฐาน"
},

{
title:"พบเศษฝุ่นหล่นบนชิ้นงาน",
question:"พบฝุ่นในผลิตภัณฑ์ และไม่ได้ทำ ทำความสะอาด ตามแผนที่กำหนด",
choices:[
"แอร์เสีย",
"พนักงานตรวจไม่พบ",
"ไม่ได้ทำความสะอาดตามกำหนด",
"เครื่องจักรเสีย"
],
answer:2,
explain:"Root Cause : ไม่ได้ทำความสะอาดตามกำหนด"
}

];

// สุ่ม Array
function shuffle(array){
    for(let i = array.length-1;i>0;i--){
        let j = Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

shuffle(questions);

let current = 0;
let score = 0;

function loadQuestion(){

    if(current >= questions.length){
        finishGame();
        return;
    }

    let q = questions[current];

    let options = q.choices.map((text,index)=>({
        text:text,
        correct:index===q.answer
    }));

    shuffle(options);

    let html = `
    <div class="card">
        <h2>ข้อ ${current+1}</h2>
        <h3>${q.title}</h3>
        <p>${q.question}</p>
    `;

    options.forEach(option=>{
        html += `
        <button class="btn option"
        onclick="selectAnswer(${option.correct})">
        ${option.text}
        </button>
        `;
    });

    html += `
    <div id="result" class="result"></div>

    <button id="nextBtn"
    class="btn"
    onclick="nextQuestion()">
    ➡️ ข้อถัดไป
    </button>

    </div>
    `;

    document.getElementById("game").innerHTML = html;
}

function selectAnswer(correct){

    let q = questions[current];

    if(correct){

        score += 10;

        document.getElementById("result").innerHTML =
        `<p class="correct">✅ ถูกต้อง</p>
         <p>${q.explain}</p>`;
    }
    else{

        document.getElementById("result").innerHTML =
        `<p class="wrong">❌ ไม่ถูกต้อง</p>
         <p>${q.explain}</p>`;
    }

    document.getElementById("score").innerText = score;

    document.querySelectorAll(".option").forEach(btn=>{
        btn.disabled = true;
    });

    document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion(){
    current++;
    loadQuestion();
}

function finishGame(){

    let rank = "Junior Inspector";

    if(score >= 60){
        rank = "🏆 Root Cause Master";
    }
    else if(score >= 40){
        rank = "🕵️ Quality Detective";
    }
    else if(score >= 20){
        rank = "👨‍🏭 Quality Engineer";
    }

    document.getElementById("game").innerHTML = `
    <div class="card final">
        <h2>🎉 จบเกม</h2>
        <h3>คะแนน ${score}/${questions.length*10}</h3>
        <h2>${rank}</h2>

        <button class="btn"
        onclick="location.reload()">
        🔄 เล่นใหม่
        </button>
    </div>
    `;
}

loadQuestion();

</script>

</body>
</html>
