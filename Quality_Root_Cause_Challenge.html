<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quality Root Cause Challenge</title><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;margin:0;padding:20px} .wrap{max-width:900px;margin:auto}.card{background:#1e293b;padding:20px;border-radius:16px;margin-top:15px}.btn{display:block;width:100%;padding:12px;margin:8px 0;border:none;border-radius:10px;background:#334155;color:#fff;cursor:pointer}.btn:hover{background:#475569}#next{display:none;background:#16a34a}.correct{color:#4ade80}.wrong{color:#f87171}</style></head><body><div class="wrap"><h1>🎯 Quality Root Cause Challenge</h1><div class="card">คะแนน: <span id="score">0</span></div><div id="game"></div></div><script>const qs=[{t:'Gold Discoloration',q:'เปลี่ยน Gold Salt Lot ใหม่เมื่อวาน และเริ่มพบสีทองซีด',o:['Operator','Gold Salt Lot ใหม่','Machine','AOI'],a:1,e:'Material มีความเป็นไปได้สูงสุด'},{t:'Rust Mystery',q:'RH=82% Spec<60% และ Air Dryer เสีย 4 วัน',o:['Supplier','Humidity สูง','Operator','Transport'],a:1,e:'สิ่งแวดล้อมความชื้นสูง'},{t:'Peeling',q:'Actual Temp 165°C หลังเปลี่ยน Heater และไม่มี Verify',o:['Material','Heater without verification','Operator','Force'],a:1,e:'ไม่มีการ Verify หลัง Maintenance'},{t:'Missing Component',q:'Feeder #7 Alarm 28 ครั้ง',o:['Program','Operator','Feeder #7 Failure','PCB'],a:2,e:'Feeder ผิดปกติ'},{t:'Dimension OOS',q:'Vernier เลย Calibration 45 วัน',o:['Material','Measurement System','Operator','Environment'],a:1,e:'Measurement ไม่น่าเชื่อถือ'}];let c=0,s=0;function show(){if(c>=qs.length){document.getElementById('game').innerHTML=`<div class=card><h2>จบเกม</h2><h3>คะแนน ${s}/50</h3><button class=btn onclick='location.reload()'>เล่นใหม่</button></div>`;return;}let q=qs[c];let h=`<div class=card><h2>${q.t}</h2><p>${q.q}</p>`;q.o.forEach((x,i)=>h+=`<button class='btn' onclick='ans(${i})'>${x}</button>`);h+=`<div id=r></div><button id=next class=btn onclick='c++;show()'>ข้อถัดไป</button></div>`;document.getElementById('game').innerHTML=h;}function ans(i){let q=qs[c];let r=document.getElementById('r');if(i===q.a){s+=10;r.innerHTML=`<p class=correct>✅ ถูกต้อง - ${q.e}</p>`;}else{r.innerHTML=`<p class=wrong>❌ ไม่ถูก - ${q.e}</p>`;}document.getElementById('score').textContent=s;document.querySelectorAll('.btn').forEach(b=>{if(b.id!=='next')b.disabled=true});document.getElementById('next').style.display='block';}show();</script></body></html>
